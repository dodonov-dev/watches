; Liquid Watch firmware. Toolchain: PlatformIO + pioarduino platform (Arduino core 3.3.x on ESP-IDF 5.5).
; The stock `espressif32` platform tops out at Arduino core 2.x, which Waveshare's
; esp_lcd-based display drivers do not support — hence pioarduino.
; Boards (pio run -e <env>; plain `pio run` builds amoled191, which the tools/ scripts default to):
;   amoled191  Waveshare ESP32-S3-AMOLED-1.91 (SKU 28872, non-touch): RM67162 536x240 QSPI AMOLED
;   lcd316     Waveshare ESP32-S3-LCD-3.16: ST7701 320x820 RGB LCD, face shown 1:1 centred (display_lcd316.cpp)
[platformio]
default_envs = amoled191

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Both boards: ESP32-S3 with 16 MB QIO flash, 8 MB octal PSRAM (N16R8 module / S3R8 + external flash)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 240000000L

build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -I../spec
    -DUSB_LEFT=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit BusIO @ ^1.17.0
    h2zero/NimBLE-Arduino @ ^2.2.3

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:amoled191]
build_src_filter = +<*> -<display_lcd316.cpp>

; The LCD runs its big canvas out of PSRAM: a 64 KB data cache with 64-byte lines (stock Arduino libs: 32 KB / 32 B)
; took the user preset from 15.2 to 18.0 fps at native (2026-10-27). That needs the Arduino libs recompiled from ESP-IDF
; (pioarduino "hybrid compile", custom_sdkconfig), which rewrites the shared libs package: this env therefore builds from
; its own packages dir, ~/.platformio/packages-lcd316 (tools/flash.sh / flash-win.sh set PLATFORMIO_PACKAGES_DIR and
; create it from the stock one on first use; tools/pio_pkgdir.py refuses a build without it). The SPIRAM boot options
; are restated because the hybrid build otherwise drops them (PSRAM joins the heap too late for static buffers).
; The AMOLED cannot spare the 32 KB of internal RAM the bigger cache takes.
; LCD_RGB_RESTART_IN_VSYNC (Arduino default y) never resets the driver's bounce-buffer EOF count: one EOF the refill
; ISR misses (an NVS save holds it off ~14 ms) swaps the buffer it refills for good and, one time in two, the face
; stays shifted sideways by a bounce buffer (41 columns, wrapped). Off (the IDF default), the driver restarts at VSYNC
; only after a missed EOF: one bad frame.
[env:lcd316]
extra_scripts = pre:tools/pio_pkgdir.py
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
build_flags = ${env.build_flags} -DBOARD_LCD316
build_src_filter = +<*> -<display.cpp>
lib_ignore = esp_lcd_sh8601

